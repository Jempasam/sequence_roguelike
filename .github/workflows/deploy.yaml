on:
  push:
    branches: [web]
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run art
      - run: npm run web:build:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs